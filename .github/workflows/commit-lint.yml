name: Commit Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commitlint:
    name: Validate Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "Validating first-parent commits from $base to $head"
          while IFS= read -r commit; do
            echo "Validating $commit"
            git show --quiet --format=%B "$commit" | npx commitlint --verbose
          done < <(git rev-list --first-parent --reverse "$base..$head")

      - name: Validate push commits
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch detected, validating HEAD commit only"
            git show --quiet --format=%B "$head" | npx commitlint --verbose
          else
            echo "Validating first-parent commits from $base to $head"
            while IFS= read -r commit; do
              echo "Validating $commit"
              git show --quiet --format=%B "$commit" | npx commitlint --verbose
            done < <(git rev-list --first-parent --reverse "$base..$head")
          fi
