name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Strict format check - MUST pass
  format-check:
    name: Format Check
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install swift-format
        run: brew install swift-format

      - name: Check Formatting
        run: |
          if ! swift-format lint --strict --recursive Sources/ Tests/; then
            echo "::error::Code is not properly formatted. Run 'swift-format format --in-place --recursive Sources/ Tests/' locally."
            exit 1
          fi

  # Strict lint check - MUST pass, no disables allowed
  lint-check:
    name: SwiftLint Strict
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Check for Forbidden Disable Tags
        run: |
          echo "Checking for forbidden swiftlint:disable/enable tags..."
          if grep -rn "swiftlint:disable\|swiftlint:enable" Sources/ Tests/ --include="*.swift"; then
            echo "::error::SwiftLint disable/enable tags are STRICTLY FORBIDDEN. Fix the underlying issues instead."
            exit 1
          fi
          echo "No forbidden tags found."

      - name: Run SwiftLint Strict
        run: |
          if ! swiftlint lint --strict --reporter github-actions-logging Sources/ Tests/; then
            echo "::error::SwiftLint violations found. All issues must be fixed."
            exit 1
          fi

  # Build with warnings as errors - MUST pass
  build-check:
    name: Build (Warnings = Errors)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build with Strict Warnings
        run: swift build -Xswiftc -warnings-as-errors

  swift-syntax-compatibility:
    name: SwiftSyntax ${{ matrix.swift-syntax }} (macOS 26 hosted)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        swift-syntax: ["600.0.1", "603.0.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record hosted toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test exact SwiftSyntax version
        env:
          MTK_MATRIX_MODE: hosted
        run: bash Scripts/test-swift-syntax-matrix.sh "${{ matrix.swift-syntax }}"

  swift-syntax-compatibility-required:
    name: SwiftSyntax Compatibility
    if: ${{ always() }}
    needs: swift-syntax-compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Require every compatibility entry
        env:
          MATRIX_RESULT: ${{ needs.swift-syntax-compatibility.result }}
        run: test "$MATRIX_RESULT" = "success"

  # All tests MUST pass
  test-check:
    name: Tests
    runs-on: macos-14
    needs: [build-check, swift-syntax-compatibility-required]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Run All Tests
        run: swift test --parallel

  # Commit message lint - MUST pass
  commitlint-check:
    name: Commit Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'

      - name: Install commitlint
        run: |
          npm install --no-save --package-lock=false @commitlint/cli @commitlint/config-conventional

      - name: Validate PR commits
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "Validating first-parent commits from $base to $head"
          git rev-list --first-parent --reverse "$base..$head" | while read -r commit; do
            git show --quiet --format=%B "$commit" | npx commitlint --verbose
          done

  # Danger validation
  danger-check:
    name: Danger
    runs-on: macos-14
    needs: [format-check, lint-check]
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'

      - name: Install Danger
        run: |
          brew tap danger/tap
          brew trust --formula danger/tap/danger-swift
          brew trust --formula danger/tap/danger-js
          brew install danger/tap/danger-swift
          npm install --global danger@13.0.10

      - name: Run Danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          danger_js_path="$(npm prefix --global)/bin/danger"
          test -x "$danger_js_path"
          danger-swift ci --danger-js-path "$danger_js_path" --failOnErrors

  # Final gate - all checks must pass
  pr-ready:
    name: PR Ready
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, build-check, test-check, danger-check, commitlint-check]
    if: always()

    steps:
      - name: Check All Jobs
        run: |
          if [ "${{ needs.format-check.result }}" != "success" ]; then
            echo "::error::Format check failed"
            exit 1
          fi
          if [ "${{ needs.lint-check.result }}" != "success" ]; then
            echo "::error::Lint check failed"
            exit 1
          fi
          if [ "${{ needs.build-check.result }}" != "success" ]; then
            echo "::error::Build check failed"
            exit 1
          fi
          if [ "${{ needs.test-check.result }}" != "success" ]; then
            echo "::error::Test check failed"
            exit 1
          fi
          if [ "${{ needs.danger-check.result }}" != "success" ]; then
            echo "::error::Danger check failed"
            exit 1
          fi
          if [ "${{ needs.commitlint-check.result }}" != "success" ]; then
            echo "::error::Commit lint check failed"
            exit 1
          fi
          echo "All checks passed! PR is ready for review."
