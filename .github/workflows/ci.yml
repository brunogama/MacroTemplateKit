name: CI

on:
  push:
    # Every branch, not just main. Branch work went uncompiled for a whole
    # release cycle because this said `branches: [main]` -- pushes to
    # perf/render-engine triggered nothing at all, so nothing was checked until
    # a PR was opened.
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Manifest Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Package.swift matches Package@swift-6.0.swift
        run: Scripts/check-manifests.sh

  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: Scripts/select-xcode.sh

      # Builds every target, MacroExamples included.
      - name: Build
        run: Scripts/build.sh

      - name: Run Tests
        run: swift test --parallel

  build-release:
    name: Build Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: Scripts/select-xcode.sh

      - name: Build Release
        run: Scripts/build.sh -c release

  benchmarks:
    name: Benchmarks
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: Scripts/select-xcode.sh

      # Benchmarks are a separate SwiftPM package and had no CI coverage at all,
      # so the pipelines every published performance figure comes from could
      # stop compiling without anything noticing.
      - name: Build Benchmarks
        working-directory: Benchmarks
        run: swift build -c release

      # Not a timing run -- absolutes on a shared runner are meaningless, and
      # ADR 0005 clause 0 forbids comparing them across invocations anyway.
      # This exists to enforce clause 3: the pipelines must stay token-identical.
      # Smallest size and iteration count that still exercises every workload.
      #
      # `--workloads` is listed explicitly because `case-path` is not in the
      # default set, and it is the workload carrying the largest published
      # margin -- the one whose equivalence claim is worth the most.
      - name: Equivalence Gate
        working-directory: Benchmarks
        run: |
          swift run -c release RenderEngineBench \
            --sizes 4 --iterations 5 --warmup 1 \
            --workloads generate,edit,case-factory,case-path

  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict Sources/ Tests/

  code-coverage:
    name: Code Coverage
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: Scripts/select-xcode.sh

      - name: Generate Coverage
        run: swift test --enable-code-coverage

      - name: Export Coverage
        run: |
          xcrun llvm-cov export \
            .build/debug/MacroTemplateKitPackageTests.xctest/Contents/MacOS/MacroTemplateKitPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format lcov \
            -ignore-filename-regex Tests/ \
            > coverage.lcov
        continue-on-error: true
