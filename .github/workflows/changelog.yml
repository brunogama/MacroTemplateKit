name: Changelog

on:
  push:
    branches: [master, main] # or just master if that's your real target

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip changelog]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          release_url="https://github.com/orhun/git-cliff/releases/download"
          archive_name="git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$release_url/v2.7.0/$archive_name" | tar xz
          sudo mv git-cliff-2.7.0/git-cliff /usr/local/bin/

      - name: Generate Changelog
        run: |
          git-cliff --config .github/cliff.toml --output CHANGELOG.md

      - name: Check for Changes
        id: check
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Changelog Pull Request
        if: steps.check.outputs.changed == 'true'
        env:
          CHANGELOG_BRANCH: automation/changelog-${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "$CHANGELOG_BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: update changelog [skip changelog]"

          remote_sha="$(
            git ls-remote --heads origin "$CHANGELOG_BRANCH" |
              awk '{ print $1 }'
          )"
          if [[ -n "$remote_sha" ]]; then
            lease="refs/heads/$CHANGELOG_BRANCH:$remote_sha"
            git push --force-with-lease="$lease" \
              origin "HEAD:refs/heads/$CHANGELOG_BRANCH"
          else
            git push origin "HEAD:refs/heads/$CHANGELOG_BRANCH"
          fi

          pr_number="$(
            gh pr list \
              --base "$GITHUB_REF_NAME" \
              --head "$CHANGELOG_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$GITHUB_REF_NAME" \
              --head "$CHANGELOG_BRANCH" \
              --title "docs: update changelog [skip changelog]" \
              --body "Automated changelog update generated by git-cliff."
          else
            echo "Updated changelog pull request #$pr_number"
          fi
