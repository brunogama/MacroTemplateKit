name: Changelog

on:
  push:
    branches: [master, main] # or just master if that's your real target

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip changelog]')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          release_url="https://github.com/orhun/git-cliff/releases/download"
          archive_name="git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz"
          install_dir="$RUNNER_TEMP/git-cliff"
          mkdir -p "$install_dir"
          cd "$install_dir"
          curl -sSfLO "$release_url/v2.7.0/$archive_name"
          curl -sSfLO "$release_url/v2.7.0/$archive_name.sha512"
          sha512sum --check "$archive_name.sha512"
          tar xzf "$archive_name"
          sudo mv git-cliff-2.7.0/git-cliff /usr/local/bin/

      - name: Prepare Release
        id: release
        run: |
          error_file="$RUNNER_TEMP/prepare-release-error.txt"
          if ! metadata="$(Scripts/prepare-release.sh 2>"$error_file")"; then
            if grep -Fq \
              'no releasable Conventional Commits exist' \
              "$error_file"; then
              cat "$error_file"
              echo "No releasable changes; nothing to prepare."
              exit 0
            fi
            cat "$error_file" >&2
            exit 1
          fi
          echo "$metadata"
          release_tag="$(
            printf '%s\n' "$metadata" | sed -n 's/^release_tag: //p'
          )"
          release_version="$(
            printf '%s\n' "$metadata" | sed -n 's/^release_version: //p'
          )"
          test -n "$release_tag"
          test -n "$release_version"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Check for Changes
        id: check
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if git diff --quiet && [[ -z "$untracked" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Changelog Pull Request
        if: steps.check.outputs.changed == 'true'
        env:
          CHANGELOG_BRANCH: automation/changelog-${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "$CHANGELOG_BRANCH"
          git add \
            CHANGELOG.md \
            LLMS.txt \
            README.md \
            RELEASE_BASE_VERSION \
            RELEASE_DISTRIBUTION \
            VERSION \
            Sources/MacroTemplateKit/Documentation.docc/GettingStarted.md \
            Sources/MacroTemplateKit/Documentation.docc/Articles/GettingStarted.md
          git commit -m "release: prepare $RELEASE_TAG [skip changelog]"

          remote_sha="$(
            git ls-remote --heads origin "$CHANGELOG_BRANCH" |
              awk '{ print $1 }'
          )"
          if [[ -n "$remote_sha" ]]; then
            lease="refs/heads/$CHANGELOG_BRANCH:$remote_sha"
            git push --force-with-lease="$lease" \
              origin "HEAD:refs/heads/$CHANGELOG_BRANCH"
          else
            git push origin "HEAD:refs/heads/$CHANGELOG_BRANCH"
          fi

          pr_number="$(
            gh pr list \
              --base "$GITHUB_REF_NAME" \
              --head "$CHANGELOG_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          title="release: prepare $RELEASE_TAG [skip changelog]"
          body="$(
            printf '%s\n' \
              "This automated release candidate prepares **$RELEASE_TAG**." \
              "" \
              "- Version chosen from Conventional Commits after VERSION" \
              "- Quick Start pinned to MacroTemplateKit $RELEASE_VERSION" \
              "- Binary contract: Xcode 16.2, Swift 6.0, SwiftSyntax 600.0.1" \
              "" \
              "After approval and merge, release automation builds and tests" \
              "the pinned macOS XCFramework before publishing the tag."
          )"

          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$GITHUB_REF_NAME" \
              --head "$CHANGELOG_BRANCH" \
              --title "$title" \
              --body "$body"
          else
            gh pr edit "$pr_number" --title "$title" --body "$body"
            echo "Updated changelog pull request #$pr_number"
          fi
