# SwiftLint Configuration for MacroTemplateKit

excluded:
  - .build
  - .swiftpm
  - Package.swift

disabled_rules:
  - trailing_comma
  - opening_brace
  - statement_position

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - number_separator
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Rule Configuration
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 800
  error: 1500

function_body_length:
  # Raised from 60/100 for the same reason `cyclomatic_complexity` ignores case
  # statements: the only functions over the old limit are the SourceEmitter
  # switches and `Statement.map`, which are one arm per enum case (currently up
  # to 134 lines for Template) and grow by one arm when a case is added.
  #
  # Both numbers move because CI runs `swiftlint --strict`, which promotes every
  # warning to an error -- so `warning:` is the real ceiling and `error:` never
  # gets a chance to matter. Raising only `error:` looks like it works and does
  # nothing.
  #
  # The alternative was splitting those switches to satisfy the linter, which
  # means restructuring the hot path of the render engine as a drive-by inside
  # a CI fix. This is the honest trade: the rule is weaker for every function,
  # in exchange for not reshaping code for a tool's benefit.
  warning: 140
  error: 200

type_body_length:
  warning: 400
  error: 800

cyclomatic_complexity:
  warning: 15
  error: 25
  # The SourceEmitter functions are one exhaustive `switch` over a node enum,
  # so their "complexity" is just the case count -- 35 for Template. That is
  # not the branching complexity this rule exists to catch, and the compiler
  # already enforces exhaustiveness, which is the property that makes these
  # switches safe to extend. Counting cases here would only push the emitters
  # into being split for the linter's benefit rather than the reader's.
  ignores_case_statements: true

enum_case_associated_values_count:
  warning: 6
  error: 8

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - to
    - op
    - i
    - j
    - x
    - y
    - z
    - a
    - b
    - s
    - l
    - r

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

function_parameter_count:
  warning: 5
  error: 7

large_tuple:
  warning: 3
  error: 4

number_separator:
  minimum_length: 5

reporter: xcode
